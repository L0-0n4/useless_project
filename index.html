<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Invisibility Cloak</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #26304a 0%,
                    #111827 35%,
                    #05070d 75%,
                    #020308 100%
                );

            color: #e8d9a8;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            overflow: hidden;
        }


        /* Magical glow */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(212, 175, 55, 0.12),
                    transparent 35%
                );

            pointer-events: none;
        }


        /* Main magical card */

        .magic-container {

            width: 94%;
            max-width: 1400px;

            padding: 35px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 25, 40, 0.96),
                    rgba(5, 8, 15, 0.98)
                );

            border: 1px solid rgba(212, 175, 55, 0.55);

            border-radius: 8px;

            box-shadow:
                0 0 25px rgba(212, 175, 55, 0.12),
                0 0 80px rgba(0, 0, 0, 0.8),
                inset 0 0 40px rgba(212, 175, 55, 0.04);
        }


        /* Decorative line */

        .ornament {
            color: #d4af37;

            font-size: 22px;

            letter-spacing: 8px;

            margin-bottom: 10px;
        }


        h1 {

            margin: 5px 0 8px;

            font-size: clamp(32px, 5vw, 64px);

            font-weight: normal;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: #d4af37;

            text-shadow:
                0 0 8px rgba(212, 175, 55, 0.5),
                0 0 25px rgba(212, 175, 55, 0.2);
        }


        .subtitle {

            margin-bottom: 28px;

            color: #b9b4a4;

            font-size: 17px;

            letter-spacing: 2px;
        }


        /* Video frame */

        .video-frame {

            position: relative;

            display: inline-block;

            padding: 8px;

            background: #090b12;

            border: 2px solid #8f7524;

            box-shadow:
                0 0 15px rgba(212, 175, 55, 0.25),
                inset 0 0 20px rgba(0, 0, 0, 0.8);
        }


        .video-frame::before,
        .video-frame::after {

            content: "✦";

            position: absolute;

            color: #d4af37;

            font-size: 22px;
        }


        .video-frame::before {
            top: -18px;
            left: -18px;
        }


        .video-frame::after {
            bottom: -18px;
            right: -18px;
        }


        img {

            display: block;

            width: min(1280px, 88vw);

            height: auto;

            max-height: 72vh;

            object-fit: contain;

            background: #000;
        }


        /* Instructions */

        .instructions {

            margin-top: 25px;

            color: #aaa58f;

            font-size: 15px;

            letter-spacing: 1px;
        }


        .instructions span {

            color: #d4af37;

            font-weight: bold;
        }


        /* Bottom decoration */

        .bottom-ornament {

            margin-top: 22px;

            color: #8f7524;

            font-size: 18px;

            letter-spacing: 12px;
        }


        /* Responsive */

        @media (max-width: 700px) {

            .magic-container {
                padding: 18px;
            }

            h1 {
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 13px;
            }

            img {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <main class="magic-container">

        <div class="ornament">
            ✦ ───── ✦
        </div>


        <h1>
            Invisibility Cloak
        </h1>


        <div class="subtitle">
            The magic is real. The cloak is waiting.
        </div>


        <div class="video-frame">

            <img
                src="{{ url_for('video') }}"
                alt="OpenCV Invisibility Cloak Camera"
            >

        </div>


        <div class="instructions">

            <span>✦</span>
            Step into the frame and reveal the magic
            <span>✦</span>

        </div>


        <div class="bottom-ornament">
            ✦ ✦ ✦
        </div>

    </main>


</body>

</html>
